<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header">
    <a class="logo" href="index.html">Xnihilo<span>.homes</span></a>
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="producto.html">Admin</a>
        <a href="login.html">Login</a>

        <div class="cart-dropdown">
            <button class="cart-button" type="button">Solicitudes (<span id="cart-count">0</span>) ▾</button>
            <div class="cart-menu" id="cart-preview">
                <p>No hay solicitudes todavía.</p>
            </div>
        </div>

        <div class="language-selector">
            <button class="language-button" type="button">🌐 <span>Idioma</span> ▾</button>
            <div class="language-menu">
                <a href="#" data-lang="en">English</a>
                <a href="#" data-lang="es">Español</a>
                <a href="#" data-lang="pt">Português</a>
            </div>
        </div>
    </nav>
</header>
<section class="section">
    <h1>Carrito de Solicitudes</h1>
    <div id="cart-container" class="panel"></div>

    <form id="request-form" class="form panel">
        <h2>Enviar solicitud</h2>
        <input type="text" id="customer-name" placeholder="Nombre completo" required>
        <input type="email" id="customer-email" placeholder="Correo electrónico" required>
        <button class="btn" type="submit">Enviar solicitud</button>
        <div id="request-message"></div>
    </form>
</section>
<footer class="footer">
    <p><strong>Xnihilo Homes</strong> — Real estate listings and property services marketplace.</p>
    <p><a href="#">Terms and Conditions</a> | <a href="#">Privacy Policy</a></p>
</footer>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/language.js"></script>
<script src="js/carrito.js"></script>
</body>
</html>
