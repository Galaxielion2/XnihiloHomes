<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xnihilo Homes | Detalle</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header">
    <a class="logo" href="index.html">Xnihilo<span>.homes</span></a>
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="producto.html">Admin</a>
        <a href="login.html">Login</a>
        <a href="carrito.html">Carrito</a>

        <div class="cart-dropdown">
            <button class="cart-button" type="button">Solicitudes (<span id="cart-count">0</span>) ▾</button>
            <div class="cart-menu" id="cart-preview">
                <p>No hay solicitudes todavía.</p>
            </div>
        </div>

        <div class="language-selector">
            <button class="language-button" type="button">🌐 <span>Idioma</span> ▾</button>
            <div class="language-menu">
                <a href="#" data-lang="en">English</a>
                <a href="#" data-lang="es">Español</a>
                <a href="#" data-lang="pt">Português</a>
            </div>
        </div>
    </nav>
</header>
<main class="section detail-layout">
    <img id="detail-image" class="detail-image" src="" alt="Producto">
    <section class="panel">
        <span id="detail-badge" class="badge"></span>
        <h1 id="detail-name">Cargando...</h1>
        <p id="detail-price" class="price"></p>
        <p id="detail-location"></p>
        <p id="detail-description"></p>
        <p><strong>Monto de reserva:</strong> <span id="detail-reservation"></span></p>
        <button id="add-to-cart" class="btn">Agregar al Carrito</button>
    </section>
</main>
<footer class="footer">
    <p><strong>Xnihilo Homes</strong> — Marketplace de propiedades y servicios inmobiliarios.</p>
    <p><a href="#">Términos y Condiciones</a> | <a href="#">Política de Privacidad</a></p>
</footer>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/language.js"></script>
<script src="js/detalle.js"></script>
</body>
</html>
