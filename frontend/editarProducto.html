<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xnihilo Homes | Editar Producto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header">
    <a class="logo" href="index.html">Xnihilo<span>.homes</span></a>
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="producto.html">Admin</a>
        <a href="login.html">Login</a>
        <a href="carrito.html">Carrito</a>

        <div class="cart-dropdown">
            <button class="cart-button" type="button">Solicitudes (<span id="cart-count">0</span>) ▾</button>
            <div class="cart-menu" id="cart-preview">
                <p>No hay solicitudes todavía.</p>
            </div>
        </div>

        <div class="language-selector">
            <button class="language-button" type="button">🌐 <span>Idioma</span> ▾</button>
            <div class="language-menu">
                <a href="#" data-lang="en">English</a>
                <a href="#" data-lang="es">Español</a>
                <a href="#" data-lang="pt">Português</a>
            </div>
        </div>
    </nav>
</header>
<main class="section">
    <form id="product-form" class="panel form">
        <h1 id="form-title">Editar listado</h1>
        <input id="name" type="text" placeholder="Nombre del listado" required>
        <select id="type" required>
            <option value="">Seleccione tipo</option>
            <option value="Property">Property</option>
            <option value="Service">Service</option>
        </select>
        <input id="category" type="text" placeholder="Categoría" required>
        <input id="price" type="number" placeholder="Precio" required>
        <input id="location" type="text" placeholder="Ubicación" required>
        <input id="reservation_amount" type="number" placeholder="Monto de reserva" required>
        <input id="image_url" type="text" placeholder="URL de imagen" required>
        <select id="status" required>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>
        <textarea id="description" placeholder="Descripción" required></textarea>
        <button class="btn" type="submit">Guardar</button>
        <div id="form-message"></div>
    </form>
</main>
<footer class="footer">
    <p><strong>Xnihilo Homes</strong> — Marketplace de propiedades y servicios inmobiliarios.</p>
    <p><a href="#">Términos y Condiciones</a> | <a href="#">Política de Privacidad</a></p>
</footer>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/language.js"></script>
<script src="js/editarProducto.js"></script>
</body>
</html>
